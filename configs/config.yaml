dataset: cifar10
beta: 0.1
data_root: ./data
num_clients: 10
num_experts: 4
topk: 2
rounds: 100
frac: 1.0
local_epochs: 1
batch_size: 64
lr: 0.01
momentum: 0.9
weight_decay: 0.0001
seed: 42
device: auto
num_workers: 2
test_batch_size: 256

# 聚合接口预留：后续会把整个模型聚合拆成非专家参数聚合和专家参数聚合
non_expert_agg_method: uniform
# uniform | sample_weighted | fisher_total | history_wolf | fisher_history_wolf | fisher_trace_per_active_sample
expert_agg_method: uniform  

# 输出目录
run_name: null
output_dir: outputs
log_client_details: true
save_jsonl: true
